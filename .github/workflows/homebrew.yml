name: update-homebrew
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: digit-homebrew-tap
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Update tap from the published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/update-homebrew.sh
  verify-install:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9
        with:
          stable: true
      - name: Install and test the published formula
        run: |
          brew trust --tap ZifferDev/tap
          brew install ZifferDev/tap/digit
          brew test ZifferDev/tap/digit
          digit console --help
